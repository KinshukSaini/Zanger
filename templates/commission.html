<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Document Editor</title>
    <link rel="stylesheet" href="{{ static_url('style.css') }}" />

  </head>
  <body>
    <div class="container">
      <!-- Left Panel: Document Preview -->
      <div class="panel">
        <h2>
          Document Preview
          <div id="editorControls">
            <!-- <button
              class="btn btn-edit"
              id="enableEditingButton"
              onclick="enableEditing()"
            >
              Edit Document
            </button>
            <button
              class="btn btn-edit"
              id="insertContentButton"
              onclick="openInsertDialog()"
              style="display: none"
            >
              Insert Content
            </button> -->
            <button class="btn btn-download" onclick="downloadWordDocx()">
              Download Word
            </button>
          </div>
        </h2>
        <div id="documentPreview" class="document-preview"></div>
      </div>

      <!-- Right Panel: Document Information -->
      <div class="panel">
        <h2>
          Document Information
          <button
            class="btn btn-add"
            id="saveDocBtn"
            onclick="submitQuestionnaire()"
          >
            Save Document
          </button>
        </h2>
        <div id="keyContainer" class="questionnaire-container"></div>
      </div>
    </div>

    <!-- AI Edit Dialog (will be created dynamically) -->
    <!-- The dialog will be inserted here via JavaScript -->

    <script>
      // Initialize document data from server
      window.currentDocument = {{ document | tojson | safe }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="{{ static_url('commission.js') }}"></script>
  </body>
</html>
