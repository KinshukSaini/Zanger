<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Legal Document Editor</title>
    <link rel="stylesheet" href="{{ static_url('style.css') }}" />

  </head>
  <body>
    <div class="container">
      <!-- Left Panel: Document Preview -->
      <div class="panel" >
        <h2>
          <div class="header">
            
              Document Preview
            
              <div class="header-controls">
                <label class="switch" title="Toggle Edit Mode">
                  <span class="switch-label">Edit mode</span>
                  <input type="checkbox" id="editModeToggle" onchange="toggleEditMode()">
                  <span class="slider round"></span>
                </label>
              
                <button 
                class="btn btn-download" 
                onclick="downloadWordDocx()">
                  Download Word
                </button>
              </div>
            
          </div>
            
        </h2>
        <div id="documentPreview" class="document-preview"></div>
      </div>

      <!-- Right Panel: Document Information -->
      <div class="panel">  
        <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 20px; border-bottom: 2px solid #ddd; padding-bottom: 10px;">
          <h2 style="margin-bottom: 0; border-bottom: none;">Document Information</h2>
          <button
            class="btn btn-add"
            id="saveDocBtn"
            onclick="submitQuestionnaire()"
          >
            Save Document
          </button>
        </div>
        <div id="keyContainer" class="questionnaire-container"></div>
      </div>
    </div>

    <!-- AI Edit Dialog (will be created dynamically) -->
    <!-- The dialog will be inserted here via JavaScript -->

    <script>
      // Initialize document data from server
      window.currentDocument = {{ document | tojson | safe }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="{{ static_url('terms.js') }}"></script>
  </body>
</html>
