<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Contract Editor</title>
    <link rel="stylesheet" href="{{ static_url('style.css') }}" />
  </head>
  <body>
    <div class="container">
      <!-- Left Panel: Contract Preview -->
      <div class="panel">
        <h2>
          Contract Preview

          <div id="editorControls">
            <!-- <button
              class="btn btn-edit"
              id="enableEditingButton"
              onclick="enableEditing()"
            >
              Edit Contract
            </button>
            <button
              class="btn btn-edit"
              id="insertContentButton"
              onclick="openInsertDialog()"
              style="display: none"
            >
              Insert Content
            </button> -->
            <button class="btn btn-download" onclick="downloadWordDocx()">
              Download Word
            </button>
          </div>
        </h2>
        <div id="documentPreview" class="document-preview"></div>
      </div>
      <!-- Right Panel: Key Editor -->
      <div class="panel">
        <h2>
          Key Editor
          <button
            class="btn btn-add"
            id="addKeyValueButton"
            onclick="openAddKeyValueDialog()"
          >
            Add New Points
          </button>
          <button
            class="btn btn-add"
            id="addSubKeyValueButton"
            onclick="openAddSubKeyValueDialog()"
          >
            Add Sub-Points
          </button>
        </h2>
        <div id="keyContainer"></div>
      </div>
    </div>

    <!-- Modal for Completing Contract Details Questionnaire -->
    <div id="questionnaireModal" class="modal" style="display: none">
      <div class="modal-content" style="width: 80%; max-width: 800px">
        <span class="close" onclick="closeQuestionnaireModal()">&times;</span>
        <h3>Complete Contract Details</h3>
        <div id="questionsContainer" style="margin-top: 20px">
          <!-- Questions will be dynamically inserted here -->
        </div>
        <div class="modal-buttons">
          <button class="btn btn-add" onclick="submitQuestionnaire()">
            Continue to Editor
          </button>
          <button class="btn btn-cancel" onclick="closeQuestionnaireModal()">
            Skip Questionnaire
          </button>
        </div>
      </div>
    </div>

    <script>
      // Initialize contract data from server
      window.currentDocument = {{ document | tojson | safe }};
    </script>
    <script src="https://cdn.jsdelivr.net/npm/html-docx-js/dist/html-docx.js"></script>
    <script src="{{ static_url('terms.js') }}"></script>
  </body>
</html>
